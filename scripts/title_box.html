<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 100%; height: 100%; }
.title { position: absolute; left: 60px; right: 60px; top: 9%; text-align: center;
  font-family: "Inter"; font-weight: 700; font-size: 77px; line-height: 1.42; letter-spacing: -0.015em; }
.title span { background: #fff; color: #000; border-radius: 20px; padding: 6px 30px 11px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="DURATION" data-width="1080" data-height="1920">
  <div id="t" class="title clip" data-start="0" data-duration="DURATION" data-track-index="0"><span>TITLE LINE 1<br>TITLE LINE 2</span></div>
</div>
<script>const tl = gsap.timeline({ paused: true }); window.__timelines["main"] = tl;</script>
</body></html>
